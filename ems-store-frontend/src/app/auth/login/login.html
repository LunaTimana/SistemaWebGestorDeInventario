<main class="login">
  <img class="login__logo" src="logoEMS.png" alt="EMS Store" />
  <section class="login__tarjeta">
    <h1>Iniciar Sesión</h1>
    <form (ngSubmit)="iniciarSesion()" #formularioLogin="ngForm">
      <label for="correo">Correo Electrónico</label>
      <input id="correo" name="correo" type="email" [(ngModel)]="correo"
        placeholder="admin@emsstore.com" autocomplete="username" required />

      <label for="contrasena">Contraseña</label>
      <div class="campo-clave">
        <input id="contrasena" name="contrasena"
          [type]="mostrarContrasena ? 'text' : 'password'" [(ngModel)]="contrasena"
          placeholder="Ingresa tu contraseña" autocomplete="current-password" required />
        <button type="button" class="campo-clave__ver"
          (click)="mostrarContrasena = !mostrarContrasena"
          [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          {{ mostrarContrasena ? 'OCULTAR' : 'MOSTRAR' }}
        </button>
      </div>

      @if (error) {
        <p class="login__error" role="alert">{{ error }}</p>
      }

      <button type="submit" class="login__boton"
        [disabled]="cargando || formularioLogin.invalid">
        {{ cargando ? 'Verificando...' : 'Ingresar al Sistema' }}
      </button>
    </form>
    <span class="login__olvido">¿Olvidaste tu contraseña?</span>
  </section>
</main>
