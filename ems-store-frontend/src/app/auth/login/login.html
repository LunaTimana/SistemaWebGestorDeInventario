<main class="login">
  <img class="login__logo" src="logoEMS.png" alt="EMS Store" />

  <section class="login__tarjeta">
    <h1>Iniciar Sesión</h1>

    <form>
      <label for="usuario">Usuario o Correo Electrónico</label>
      <input id="usuario" type="text" placeholder="admin@emsstore.com" />

      <label for="clave">Contraseña</label>
      <div class="campo-clave">
        <input id="clave" type="password" placeholder="••••••••" />
        <button type="button" class="campo-clave__ver">MOSTRAR</button>
      </div>

      <button type="submit" class="login__boton">Ingresar al Sistema</button>
    </form>

    <span class="login__olvido">¿Olvidaste tu contraseña?</span>
  </section>
</main>
