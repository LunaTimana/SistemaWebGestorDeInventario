<div class="row g-3">
  <!-- Formulario -->
  <div class="col-12 col-lg-8">
    <form class="tarjeta">
      <h2 class="titulo-formulario">Especificaciones del Artículo Deportivo</h2>

      <div class="row g-3">
        <div class="col-12 col-md-8">
          <label for="nombre">Nombre del Producto *</label>
          <input id="nombre" type="text" value="Calzas Cortas de Compresión Under Armour" />
        </div>
        <div class="col-12 col-md-4">
          <label for="sku">SKU (Generado) *</label>
          <input id="sku" type="text" value="UA-COMP-SHORT-L" readonly />
        </div>

        <div class="col-6 col-md-3">
          <label for="categoria">Categoría *</label>
          <select id="categoria">
            <option selected>Ropa Deportiva</option>
            <option>Calzado Deportivo</option>
            <option>Accesorios</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="marca">Marca *</label>
          <select id="marca">
            <option selected>Under Armour</option>
            <option>Nike</option>
            <option>Adidas</option>
            <option>Puma</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="talla">Talla *</label>
          <select id="talla">
            <option>S</option>
            <option>M</option>
            <option selected>L</option>
            <option>XL</option>
            <option>42</option>
            <option>43</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label for="color">Color *</label>
          <select id="color">
            <option selected>Negro / Verde</option>
            <option>Negro</option>
            <option>Azul Marino</option>
            <option>Gris</option>
            <option>Blanco</option>
            <option>Neon Verde</option>
          </select>
        </div>

        <div class="col-6 col-md-3">
          <label for="costo">Costo Unitario (S/) *</label>
          <input id="costo" type="number" step="0.01" min="0" value="24.50" />
        </div>
        <div class="col-6 col-md-3">
          <label for="precio">Precio Comercial Venta (S/) *</label>
          <input id="precio" type="number" step="0.01" min="0" value="59.99" />
        </div>
        <div class="col-6 col-md-3">
          <label for="cantidad">Cantidad Inicial *</label>
          <input id="cantidad" type="number" min="0" value="50" />
        </div>
        <div class="col-6 col-md-3">
          <label for="proveedor">Proveedor Asociado</label>
          <select id="proveedor">
            <option selected>UA Distribuidora</option>
            <option>Distribuidora Nike</option>
            <option>Distribuidora Adidas</option>
            <option>Distribuidora Puma</option>
          </select>
        </div>
      </div>

      <div class="acciones-formulario">
        <button type="button" class="boton-lima">Guardar Producto</button>
        <a class="boton-claro" routerLink="/inventario">Cancelar</a>
      </div>
    </form>
  </div>

  <!-- Columna derecha -->
  <div class="col-12 col-lg-4 d-flex flex-column gap-3">
    <section class="tarjeta">
      <h3 class="titulo-formulario">Imagen del Producto</h3>
      <label class="subida" for="imagen">
        <i class="bi bi-image"></i>
        <strong>Subir archivo de imagen</strong>
        <small>PNG, JPG de alta resolución</small>
        <input id="imagen" type="file" accept="image/png, image/jpeg" hidden />
      </label>
    </section>

    <section class="previsualizacion">
      <h3>Previsualización Financiera</h3>
      <div class="previsualizacion__fila">
        <span>Margen Comercial Estimado</span>
        <strong class="verde">59.1%</strong>
      </div>
      <div class="previsualizacion__fila">
        <span>Ganancia Neta por Unidad</span>
        <strong>+S/ 35.49</strong>
      </div>
      <div class="previsualizacion__fila">
        <span>Valor Inicial Inventario</span>
        <strong>S/ 1,225.00</strong>
      </div>
    </section>
  </div>
</div>
