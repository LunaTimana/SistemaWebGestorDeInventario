# Misma estrategia de conexion por variables de entorno que ProyWeb
# Puedes sobrescribir DB_URL, DB_USERNAME y DB_PASSWORD sin modificar el codigo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_store}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
