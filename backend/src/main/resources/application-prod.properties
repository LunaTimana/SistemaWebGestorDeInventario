# Producción: usa un PKCS12 real y accede a la API por HTTPS.
server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEY_STORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD}
server.ssl.key-alias=${TLS_KEY_ALIAS:ems-store}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
