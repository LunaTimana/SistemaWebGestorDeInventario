spring.application.name=backend

# Configura DB_PASSWORD en PowerShell; no guardes contraseñas reales en el proyecto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_store?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Valida el esquema existente sin crear ni borrar tablas.
spring.jpa.hibernate.ddl-auto=update

# Crea las tablas JDBC que no estén presentes antes de inicializar JPA.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
