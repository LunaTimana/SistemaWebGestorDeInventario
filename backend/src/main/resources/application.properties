spring.application.name=ems-store-backend

# Conexión a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_store?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Para que la API devuelva el motivo de los errores (400, 409...)
server.error.include-message=always
server.error.include-binding-errors=always

# Subida de archivos (el Excel de stock pesa unos 2 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8083

# Autenticación stateless con JWT HS256. Define JWT_SECRET como Base64 (32 bytes mínimo).
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
