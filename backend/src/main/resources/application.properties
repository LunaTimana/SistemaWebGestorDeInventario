spring.application.name=ems-store-backend

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ems_store?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password= adminLuna123#

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Para que la API devuelva el motivo de los errores (400, 409...)
server.error.include-message=always
server.error.include-binding-errors=always

# Subida de archivos (el Excel de stock pesa unos 2 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8082